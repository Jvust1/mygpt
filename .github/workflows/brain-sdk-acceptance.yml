name: Brain SDK acceptance (no live model)

on:
  push:
    branches: [feat/book-context-brain-20260922, feat/book-contract-audit-v1]
    paths:
      - 'host/fixtures.js'
      - 'host/examples/selection-demo.json'
      - 'host/brain*.js'
      - 'host/brain.html'
      - 'brain/mygpt_brain/**'
      - 'brain/tests/**'
      - 'brain/schemas/**'
      - 'brain/scripts/**'
      - 'brain/pyproject.toml'
      - 'brain/requirements-linux-py313.lock'
      - '.github/workflows/brain-sdk-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: mygpt-brain-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-sdk:
    if: github.repository == 'Jvust2/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Resolve or restore exact wheel lock in isolated environment
        working-directory: brain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brain-evidence"
          python -m venv "$RUNNER_TEMP/brain-resolve"
          PY="$RUNNER_TEMP/brain-resolve/bin/python"
          if test -f requirements-linux-py313.lock; then
            "$PY" -m pip install --only-binary=:all: --require-hashes -r requirements-linux-py313.lock --report "$RUNNER_TEMP/brain-evidence/install-report.json"
            cp requirements-linux-py313.lock "$RUNNER_TEMP/brain-evidence/requirements-linux-py313.lock"
          else
            "$PY" -m pip install --only-binary=:all: --report "$RUNNER_TEMP/brain-evidence/install-report.json" pydantic==2.13.4 pydantic-ai-slim==2.46.0 mcp==2.2.0 pytest==9.0.2 pytest-asyncio==1.3.0
            "$PY" scripts/lock_from_report.py "$RUNNER_TEMP/brain-evidence/install-report.json" "$RUNNER_TEMP/brain-evidence/requirements-linux-py313.lock"
          fi
          "$PY" -m pip check
      - name: Require all SDK cases and zero skips
        working-directory: brain
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/brain-resolve/bin/python" scripts/verify_integrations.py --output "$RUNNER_TEMP/brain-evidence/first"
      - name: Reinstall locked wheels in a second clean environment and retest
        working-directory: brain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/brain-reinstall"
          PY="$RUNNER_TEMP/brain-reinstall/bin/python"
          "$PY" -m pip install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/brain-evidence/requirements-linux-py313.lock"
          "$PY" -m pip check
          "$PY" scripts/verify_integrations.py --output "$RUNNER_TEMP/brain-evidence/reinstall"
          PYTHONPATH=. "$PY" scripts/smoke_local_service.py --root .. --output "$RUNNER_TEMP/brain-evidence/local-http-smoke.json" | tee "$RUNNER_TEMP/brain-evidence/local-http-smoke.txt"
          PYTHONPATH=. "$PY" -m mygpt_brain > "$RUNNER_TEMP/brain-evidence/demo.jsonl"
          PYTHONPATH=. "$PY" -m mygpt_brain.reader_demo > "$RUNNER_TEMP/brain-evidence/reader-demo.json"
          PYTHONPATH=. "$PY" -m mygpt_brain.host_fixtures --check ../host/fixtures.js | tee "$RUNNER_TEMP/brain-evidence/fixture-check.txt"
          PYTHONPATH=. "$PY" scripts/smoke_selection_intake.py --output "$RUNNER_TEMP/brain-evidence/selection-http-smoke.json" | tee "$RUNNER_TEMP/brain-evidence/selection-http-smoke.txt"
          "$PY" -m mygpt_brain.selection_packet validate ../host/examples/selection-demo.json > "$RUNNER_TEMP/brain-evidence/selection-packet-check.json"
          "$PY" -m compileall -q mygpt_brain scripts tests
          git rev-parse HEAD > "$RUNNER_TEMP/brain-evidence/source-commit.txt"
          sha256sum "$RUNNER_TEMP/brain-evidence/requirements-linux-py313.lock" > "$RUNNER_TEMP/brain-evidence/lock.sha256"
      - name: Preserve bounded test evidence (not credentials or environments)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: brain-sdk-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-evidence/
          if-no-files-found: warn
          retention-days: 3
