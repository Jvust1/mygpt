name: AIRI companion brain focused acceptance

on:
  push:
    branches: [feat/airi-paired-history-fusion-dot-20260930, feat/airi-chat-memory-brain-20260929, feat/openwakeword-gate-20260930, fix/voice-activation-test-20260930, feat/pipecat-turn-control-20260930, feat/livekit-turn-fusion-20261001, feat/airi-runtime-fusion-dot-20260930]
    paths:
      - 'brain/mygpt_brain/conversation.py'
      - 'brain/mygpt_brain/memory_store.py'
      - 'brain/mygpt_brain/session_store.py'
      - 'brain/mygpt_brain/companion_chat.py'
      - 'brain/mygpt_brain/airi_act.py'
      - 'brain/mygpt_brain/providers.py'
      - 'brain/mygpt_brain/companion_service.py'
      - 'brain/mygpt_brain/character_card.py'
      - 'brain/mygpt_brain/wakeword.py'
      - 'brain/mygpt_brain/vad.py'
      - 'brain/mygpt_brain/voice_activation.py'
      - 'brain/mygpt_brain/turn_control.py'
      - 'brain/mygpt_brain/livekit_bridge.py'
      - 'brain/personas/**'
      - 'brain/history_tests/**'
      - 'third_party/airi/reference/**'
      - 'brain/tests/test_conversation.py'
      - 'brain/tests/test_memory_store.py'
      - 'brain/tests/test_session_store.py'
      - 'brain/tests/test_companion_chat.py'
      - 'brain/tests/test_airi_act.py'
      - 'brain/tests/test_providers.py'
      - 'brain/tests/test_character_card.py'
      - 'brain/tests/test_wakeword.py'
      - 'brain/tests/test_vad.py'
      - 'brain/tests/test_voice_activation.py'
      - 'brain/tests/test_turn_control.py'
      - 'brain/tests/test_livekit_bridge.py'
      - 'brain/tests/test_companion_service.py'
      - 'brain/scripts/serve_companion_ollama.py'
      - '.github/workflows/airi-chat-acceptance.yml'

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install focused test dependencies
        working-directory: brain
        run: python -m pip install '.[test]'
      - name: Run AIRI/MyGPT focused suite
        working-directory: brain
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q             tests/test_conversation.py             tests/test_memory_store.py             tests/test_session_store.py             tests/test_companion_chat.py             tests/test_providers.py \
            tests/test_character_card.py \
            tests/test_wakeword.py \
            tests/test_vad.py \
            tests/test_voice_activation.py \
            tests/test_turn_control.py \
            tests/test_airi_act.py \
            tests/test_companion_service.py \
            tests/test_pipecat_bridge.py \
            tests/test_livekit_bridge.py
      - name: Compare paired history with unchanged pinned AIRI source
        working-directory: brain
        run: python -m pytest -q history_tests
      - name: Compile new runtime modules
        working-directory: brain
        run: python -m compileall -q mygpt_brain scripts/chat_local_ollama.py scripts/serve_companion_ollama.py
