name: Android companion boundary spike
on:
  workflow_call:
  push:
    paths:
      - 'android_spike/**'
      - 'android_*/**/build.gradle.kts'
      - 'android_llm_spike/app/src/main/assets/**'
      - 'android_voice_spike/app/src/main/assets/**'
      - 'third_party/airi/LICENSE'
      - 'android_llm_spike/book-client-sdk/**'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/ModelFingerprintManifest.java'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/SherpaModelIdentity.java'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/AudioFloatResampler.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/AudioFloatResamplerSmoke.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/ModelFingerprintManifestSmoke.java'
      - 'third_party/gson/**'
      - 'third_party/scikit-learn/**'
      - 'android_llm_spike/companion/src/main/java/dev/mygpt/companionv2/LocalCompanionMemoryStore.kt'
      - '.github/workflows/android-spike.yml'
  pull_request:
    paths:
      - 'android_spike/**'
      - 'android_*/**/build.gradle.kts'
      - 'android_llm_spike/app/src/main/assets/**'
      - 'android_voice_spike/app/src/main/assets/**'
      - 'third_party/airi/LICENSE'
      - 'android_llm_spike/book-client-sdk/**'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/AudioFloatResampler.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/AudioFloatResamplerSmoke.java'
      - 'third_party/gson/**'
      - 'third_party/scikit-learn/**'
      - 'android_llm_spike/companion/src/main/java/dev/mygpt/companionv2/LocalCompanionMemoryStore.kt'
      - '.github/workflows/android-spike.yml'

permissions:
  contents: read

concurrency:
  group: mygpt-android-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java8-boundary:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Fetch and verify pinned Gson streaming reader
        shell: bash
        run: |
          set -euo pipefail
          GSON_JAR="$RUNNER_TEMP/gson-2.14.0.jar"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar \
            -o "$GSON_JAR"
          python android_spike/tools/verify_gson_artifact.py "$GSON_JAR"
          echo "GSON_JAR=$GSON_JAR" >> "$GITHUB_ENV"
      - name: Compile for Java 8 and run boundary smoke
        shell: bash
        run: |
          bash android_spike/tools/run_boundary_smoke.sh

  android-debug-host:
    if: github.repository == 'Jvust/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Check hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build isolated synthetic Android test host
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_spike :app:assembleDebug --no-daemon
      - name: Verify Spine host APK native payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          apk = "android_spike/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = "lib/arm64-v8a/libgdx.so"
              if required not in names:
                  raise SystemExit(f"missing {required}")
              if "classes.dex" not in names:
                  raise SystemExit("missing classes.dex")
              if "assets/SPINE_RUNTIME_LICENSE.txt" not in names:
                  raise SystemExit("missing Spine runtime license notice")
              print("APK native payload PASS:", required)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mygpt-spine-3714430278-android-spike
          path: android_spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
