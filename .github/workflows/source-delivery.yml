name: Source delivery and clean recovery
on:
  workflow_call:
  push:
    branches:
      - feat/fusion-source-recovery-dot-20260930
      - feat/companion-fusion-story-dot-20260930
      - feat/airi-chat-memory-brain-20260929
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mygpt-source-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-recovery:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OTEL_SDK_DISABLED: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, build twice and verify exact committed source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/source-evidence"
          mkdir -p "$OUT"
          python -m pip install --only-binary=:all: --require-hashes -r brain/requirements-linux-py313.lock
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$OUT/delivery-tests.txt"
          python scripts/source_bundle.py build --commit "$GITHUB_SHA" --output "$OUT/mygpt-source.zip" | tee "$OUT/build.json"
          python scripts/source_bundle.py build --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/source-repeat.zip" > "$OUT/repeat.json"
          cmp "$OUT/mygpt-source.zip" "$RUNNER_TEMP/source-repeat.zip"
          sha256sum "$OUT/mygpt-source.zip" > "$OUT/source.sha256"
          git rev-parse HEAD > "$OUT/source-commit.txt"
      - name: Recover to a new directory without fetching external submodules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, zipfile
          from scripts.source_bundle import verify
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-evidence'
          report = json.loads((out / 'build.json').read_text())
          verified = verify(out / 'mygpt-source.zip', report['sha256'])
          assert verified['source_commit'] == os.environ['GITHUB_SHA']
          assert len(verified['external_submodules']) == 2
          assert verified['submodule_sources_included'] is False
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovered-source'
          dest.mkdir(exist_ok=False)
          # All member names, modes, sizes and hashes passed strict verification.
          with zipfile.ZipFile(out / 'mygpt-source.zip') as archive:
              archive.extractall(dest)
          for item in verified['external_submodules']:
              assert not (dest / item['path']).exists()
          print('Recovered tracked source; two pinned upstream trees remain external')
          PY
      - name: Prove recovered Python and JavaScript without original project imports
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/source-evidence"
          SRC="$RUNNER_TEMP/recovered-source"
          unset PYTHONPATH
          cd "$SRC"
          python run_mygpt.py doctor | tee "$OUT/doctor.json"
          python scripts/launcher_smoke.py --output "$OUT/launcher-http.json"
          python -m unittest discover -s tests -p 'test_*.py' -q
          node --test tests/*.test.mjs
          cd brain
          python scripts/verify_integrations.py --output "$OUT/recovered-brain"
          PYTHONPATH=. python scripts/smoke_selection_intake.py --output "$OUT/recovered-http.json"
      - name: Prove recovered Java sources with the verified external Gson jar
        shell: bash
        run: |
          set -euo pipefail
          export GSON_JAR="$RUNNER_TEMP/gson-2.14.0.jar"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar \
            -o "$GSON_JAR"
          cd "$RUNNER_TEMP/recovered-source"
          bash android_spike/tools/run_boundary_smoke.sh | tee "$RUNNER_TEMP/source-evidence/recovered-java.txt"
      - name: Preserve source and bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: source-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/
          retention-days: 3
          if-no-files-found: warn
