name: Integrated companion fusion acceptance

on:
  push:
    branches:
      - feat/companion-fusion-story-dot-20260930
      - feat/sklearn-unicode-recall-dot-20260930
      - fix/book-unicode-budget-dot-20260930
      - fix/pipecat-restart-receipts-dot-20260930
      - fix/android-tts-completion-dot-20260930
      - chore/fusion-checkpoint-dot-20261001
      - fix/book-context-admission-dot-20261001
      - fix/native-body-deadline-dot-20261001
      - fix/memory-update-atomic-dot-20261001
      - docs/fusion-governance-checkpoint-dot-20261001
      - fix/memory-noop-result-dot-20261001
      - fix/cli-input-recovery-dot-20261001
      - fix/wake-confidence-boundary-dot-20261001
      - fix/lossless-receipt-storage-dot-20261002
      - fix/windows-exact-head-dot-20261002
      - fix/dependency-locks-dot-20261002
      - fix/governance-checkpoint-dot-20261002
      - fix/npm-discovery-dot-20261002
      - fix/android-required-gate-dot-20261002
      - feat/katex-book-preview-dot-20261001
      - feat/companion-fusion-main-dot-20261001
      - feat/airi-chat-memory-brain-20260929
    paths:
      - 'brain/**'
      - 'host/**'
      - 'desktop*.py'
      - 'desktop_ui/**'
      - 'tools/build_windows_delivery.py'
      - 'tools/desktop_browser_test.py'
      - '.github/workflows/desktop-delivery.yml'
      - 'scripts/serve.mjs'
      - 'android_spike/**'
      - 'android_*/**/build.gradle.kts'
      - 'android_*/app/src/main/assets/**'
      - 'third_party/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/companion-fusion-acceptance.yml'
      - '.github/workflows/android-spike.yml'
      - '.github/workflows/source-delivery.yml'
      - 'scripts/source_bundle.py'
      - 'scripts/assert_required_jobs.py'
      - 'scripts/validate_governance.py'
      - '.gitmodules'
      - 'governance/project_state.json'
      - 'docs/HANDOFF.md'
      - 'docs/EVALUATION_LEDGER.md'
      - '.github/workflows/validate.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-fusion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-components:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore complete Linux dependency closure in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fusion-dependencies"
          mkdir -p "$OUT"
          python -m venv "$RUNNER_TEMP/fusion-venv"
          PY="$RUNNER_TEMP/fusion-venv/bin/python"
          echo "$RUNNER_TEMP/fusion-venv/bin" >> "$GITHUB_PATH"
          LOCK=brain/requirements-linux-py313-full.lock
          "$PY" brain/scripts/verify_dependency_lock.py "$LOCK" --project brain --bootstrap-output "$OUT/bootstrap.lock"
          "$PY" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r "$OUT/bootstrap.lock"
          # Only the exact hash-reviewed docopt 0.6.2 sdist is allowed. No isolated build downloads.
          "$PY" -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-binary=docopt --no-build-isolation --require-hashes -r "$LOCK" -d "$RUNNER_TEMP/fusion-artifacts"
          "$PY" -m pip --isolated install --no-cache-dir --no-index --find-links="$RUNNER_TEMP/fusion-artifacts" --only-binary=:all: --no-binary=docopt --no-build-isolation --require-hashes --force-reinstall -r "$LOCK" --report "$OUT/native-install-report.json"
          "$PY" -m pip --isolated install --no-index --no-build-isolation --no-deps ./brain
          "$PY" -m pip check
          "$PY" brain/scripts/verify_dependency_lock.py "$LOCK" --project brain --installed --install-report "$OUT/native-install-report.json" --output "$OUT/installed.json"
          git rev-parse HEAD > "$OUT/source-commit.txt"
      - name: Preserve dependency hashes and actual native install evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fusion-dependencies/
          retention-days: 3
          if-no-files-found: error
      - name: Require full strict Brain acceptance without skips
        working-directory: brain
        run: python scripts/verify_integrations.py --output "$RUNNER_TEMP/fusion-brain-evidence"
      - name: Exercise integrated stories and actual upstream oracles
        working-directory: brain
        run: python scripts/verify_fusion_upstreams.py --output "$RUNNER_TEMP/fusion-upstream-evidence"
      - name: Require linear new receipt storage and zero durable runtime caches
        working-directory: brain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-growth"
          python scripts/verify_receipt_growth.py --rounds 1000 10000 \
            --output "$RUNNER_TEMP/receipt-growth/growth.json"
          git rev-parse HEAD > "$RUNNER_TEMP/receipt-growth/source-commit.txt"
      - name: Preserve synthetic receipt storage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: receipt-growth-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-growth/
          retention-days: 3
          if-no-files-found: error
      - name: Require repository regressions and compile runtime
        run: |
          python scripts/validate_governance.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          npm test
          python -m compileall -q brain/mygpt_brain

      - name: Verify actual local Book math preview in Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mygpt-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/mygpt-browser/node_modules"
          export MYGPT_CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$MYGPT_CHROMIUM_PATH"
          MYGPT_TEST_OUTPUT="$RUNNER_TEMP/math-preview" node tests/math-preview-browser.cjs

      - name: Preserve synthetic browser proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: math-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/math-preview/
          retention-days: 3
          if-no-files-found: warn

  android-java-boundaries:
    if: github.repository == 'Jvust1/mygpt'
    uses: ./.github/workflows/android-spike.yml
    permissions:
      contents: read

  source-recovery:
    if: github.repository == 'Jvust1/mygpt'
    uses: ./.github/workflows/source-delivery.yml
    permissions:
      contents: read

  windows-desktop:
    if: github.repository == 'Jvust1/mygpt'
    needs: production-components
    uses: ./.github/workflows/desktop-delivery.yml
    permissions:
      contents: read

  fusion-required-gate:
    if: ${{ always() }}
    needs: [production-components, android-java-boundaries, source-recovery, windows-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require every aggregate component to execute successfully
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/assert_required_jobs.py production-components android-java-boundaries source-recovery windows-desktop
