name: Host UI acceptance (synthetic local Brain only)
on:
  push:
    branches: [feat/book-contract-audit-v1, feat/integrate-pr6-book-bridge-20250925, feat/desktop-delivery-20250925]
    paths:
      - 'host/**'
      - 'companion/**'
      - 'brain/mygpt_brain/local_service.py'
      - 'brain/mygpt_brain/local_engine.py'
      - 'brain/mygpt_brain/selection*.py'
      - 'brain/mygpt_brain/json_boundary.py'
      - 'brain/mygpt_brain/core.py'
      - 'tests/selection-*.mjs'
      - 'tests/selection-browser.cjs'
      - 'brain/mygpt_brain/adapters.py'
      - 'brain/mygpt_brain/host_fixtures.py'
      - 'brain/requirements-linux-py313.lock'
      - 'tests/host-*.mjs'
      - 'tests/host-browser.cjs'
      - 'tests/brain-*.mjs'
      - 'tests/brain-host-browser.cjs'
      - 'tests/browser.cjs'
      - 'tests/atlas.test.mjs'
      - 'package.json'
      - 'scripts/serve.mjs'
      - '.github/workflows/host-ui-acceptance.yml'
  pull_request:
    branches: [codex/progress-mygpt-20260927, feat/book-contract-audit-v1, feat/integrate-pr6-book-bridge-20250925, feat/desktop-delivery-20250925]
    paths:
      - 'host/**'
      - 'companion/**'
      - 'brain/mygpt_brain/local_service.py'
      - 'brain/mygpt_brain/local_engine.py'
      - 'brain/mygpt_brain/selection*.py'
      - 'brain/mygpt_brain/json_boundary.py'
      - 'brain/mygpt_brain/core.py'
      - 'tests/selection-*.mjs'
      - 'tests/selection-browser.cjs'
      - 'brain/mygpt_brain/adapters.py'
      - 'brain/mygpt_brain/host_fixtures.py'
      - 'brain/requirements-linux-py313.lock'
      - 'tests/host-*.mjs'
      - 'tests/host-browser.cjs'
      - 'tests/brain-*.mjs'
      - 'tests/brain-host-browser.cjs'
      - 'tests/browser.cjs'
      - 'tests/atlas.test.mjs'
      - 'package.json'
      - 'scripts/serve.mjs'
      - '.github/workflows/host-ui-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: mygpt-host-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'Jvust/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install isolated locked Python and pinned browser test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-evidence"
          node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1)"
          node --version > "$RUNNER_TEMP/host-evidence/node-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/host-evidence/source-commit.txt"
          python -m venv "$RUNNER_TEMP/brain-browser"
          PY="$RUNNER_TEMP/brain-browser/bin/python"
          "$PY" -m pip install --only-binary=:all: --require-hashes -r brain/requirements-linux-py313.lock --report "$RUNNER_TEMP/host-evidence/python-install-report.json"
          "$PY" -m pip check | tee "$RUNNER_TEMP/host-evidence/python-pip-check.txt"
          "$PY" --version > "$RUNNER_TEMP/host-evidence/python-version.txt"
          npm install --prefix "$RUNNER_TEMP/host-tools" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.0
          cp "$RUNNER_TEMP/host-tools/package-lock.json" "$RUNNER_TEMP/host-evidence/npm-package-lock.json"
          node "$RUNNER_TEMP/host-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run all Node unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/host-evidence/node-tests.txt"
      - name: Run existing Jonah, replay host, and real loopback Python host checks serially
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/host-tools/node_modules"
          MYGPT_TEST_OUTPUT="$RUNNER_TEMP/host-evidence/jonah" node tests/browser.cjs | tee "$RUNNER_TEMP/host-evidence/jonah-run.txt"
          MYGPT_TEST_OUTPUT="$RUNNER_TEMP/host-evidence/replay-host" node tests/host-browser.cjs | tee "$RUNNER_TEMP/host-evidence/replay-host-run.txt"
          MYGPT_TEST_OUTPUT="$RUNNER_TEMP/host-evidence/python-host" MYGPT_PYTHON="$RUNNER_TEMP/brain-browser/bin/python" node tests/brain-host-browser.cjs | tee "$RUNNER_TEMP/host-evidence/python-host-run.txt"
          MYGPT_TEST_OUTPUT="$RUNNER_TEMP/host-evidence/selection-host" MYGPT_PYTHON="$RUNNER_TEMP/brain-browser/bin/python" node tests/selection-browser.cjs | tee "$RUNNER_TEMP/host-evidence/selection-host-run.txt"
      - name: Preserve bounded source-linked evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: host-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-evidence/
          if-no-files-found: warn
          retention-days: 3
