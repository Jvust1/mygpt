[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygpt-brain-prototype"
version = "0.1.0"
description = "Simulation-only, quiet-first Book context bridge"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4", "httpx==0.28.1"]

[project.optional-dependencies]
lexical-test = ["scikit-learn==1.9.1"]
agents = ["openai-agents"]
mem0 = ["mem0ai"]
livekit = ["livekit-agents"]
realtime = ["pipecat-ai==1.12.0"]
voice = ["openwakeword", "silero-vad"]
integrations = ["pydantic-ai-slim==2.46.0", "mcp==2.2.0"]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["mygpt_brain*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
