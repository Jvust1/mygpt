name: Lexical memory upstream parity

on:
  push:
    branches:
      - feat/sklearn-memory-fusion-dot-20260930
      - feat/airi-chat-memory-brain-20260929
    paths:
      - 'brain/mygpt_brain/**'
      - 'brain/tests/**'
      - 'brain/lexical_tests/**'
      - 'brain/pyproject.toml'
      - '.github/workflows/lexical-memory-acceptance.yml'

permissions:
  contents: read

jobs:
  actual-sklearn:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install repository SDKs and pinned upstream test oracle
        working-directory: brain
        run: python -m pip install '.[test,integrations,lexical-test]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Require full Brain suite with zero skips
        working-directory: brain
        env:
          OTEL_SDK_DISABLED: 'true'
        run: python scripts/verify_integrations.py --output "$RUNNER_TEMP/lexical-brain-evidence"
      - name: Compare port with actual scikit-learn offline
        working-directory: brain
        run: python -m pytest -q lexical_tests --strict-markers
      - name: Compile runtime
        working-directory: brain
        run: python -m compileall -q mygpt_brain
