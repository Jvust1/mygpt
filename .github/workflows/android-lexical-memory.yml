name: Android lexical memory actual sklearn oracle
on:
  push:
    branches:
      - feat/sklearn-android-memory-dot-20260930
      - feat/airi-chat-memory-brain-20260929
    paths:
      - 'android_spike/**'
      - 'android_llm_spike/companion/**'
      - 'third_party/scikit-learn/**'
      - 'tests/test_android_lexical_integration.py'
      - '.github/workflows/android-lexical-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-sklearn-oracle:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install the existing exact test-only oracle pin
        run: python -m pip install --only-binary=:all: scikit-learn==1.9.1
      - name: Compare every fixture to real sklearn and verify production call site
        run: |
          python android_spike/tools/lexical_sklearn_oracle.py
          python android_spike/tools/verify_lexical_integration.py
          python -m unittest tests.test_android_lexical_integration -v
