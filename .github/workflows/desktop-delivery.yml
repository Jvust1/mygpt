name: Exact-head Windows native verification
on:
  # Only the aggregate calls this workflow, after its unchanged Linux strict gate.
  # The obsolete standalone delivery push/dispatch path is intentionally retired.
  workflow_call:
permissions:
  contents: read
jobs:
  windows-native:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OTEL_SDK_DISABLED: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact checkout and create metadata directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-evidence" | Out-Null
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Exact source commit mismatch' }
          $actual | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-evidence/source-commit.txt"
      - name: Restore hash-locked Windows build closure in a clean environment
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/windows-evidence"
          python -m venv "$env:RUNNER_TEMP/windows-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:RUNNER_TEMP/windows-venv/Scripts/python.exe"
          "$env:RUNNER_TEMP/windows-venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $lock = "brain/requirements-windows-py313-build.lock"
          & $py brain/scripts/verify_dependency_lock.py $lock --project brain --output "$out/dependency-preflight.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r $lock -d "$env:RUNNER_TEMP/windows-wheels"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip --isolated install --no-cache-dir --no-index --find-links="$env:RUNNER_TEMP/windows-wheels" --only-binary=:all: --require-hashes --force-reinstall -r $lock --report "$out/native-install-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip --isolated install --no-index --no-build-isolation --no-deps ./brain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py brain/scripts/verify_dependency_lock.py $lock --project brain --installed --install-report "$out/native-install-report.json" --output "$out/installed-dependencies.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pytest -q brain/tests/test_dependency_lock.py brain/tests/test_acceptance_tools.py --junitxml="$out/dependency-tests.xml" 2>&1 | Tee-Object "$out/dependency-tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import os, pathlib, xml.etree.ElementTree as E; t=E.parse(pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-evidence/dependency-tests.xml'); assert len(list(t.iter('testcase'))) > 0; assert not any(int(s.get(k,0)) for s in t.iter('testsuite') for k in ('failures','errors','skipped'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip freeze --all | Set-Content -Encoding utf8 "$out/dependencies.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows desktop HTTP persistence and isolated artifact-root regressions
        shell: pwsh
        run: |
          # AF_UNIX offline/POSIX suites stay mandatory in production-components on Linux.
          python -m pytest tests/test_desktop_state.py tests/test_desktop_workspace.py tests/test_desktop_chat.py tests/test_windows_delivery.py -ra --junitxml="$env:RUNNER_TEMP/windows-evidence/pytest.xml" 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/pytest.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os, pathlib, xml.etree.ElementTree as E; t=E.parse(pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-evidence/pytest.xml'); assert not any(int(s.get(k,0)) for s in t.iter('testsuite') for k in ('failures','errors','skipped'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/node-tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop_ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test native executable browser math and restart
        shell: pwsh
        run: |
          python tools/build_windows_delivery.py --source-commit "$env:GITHUB_SHA" --evidence-dir "$env:RUNNER_TEMP/windows-evidence" 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/build.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only synthetic verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-${{ github.sha }}-${{ github.run_attempt }}
          # Explicit files, never dist/, delivery/, native binaries or user-data/boot logs.
          path: |
            ${{ runner.temp }}/windows-evidence/source-commit.txt
            ${{ runner.temp }}/windows-evidence/dependencies.txt
            ${{ runner.temp }}/windows-evidence/dependency-preflight.json
            ${{ runner.temp }}/windows-evidence/dependency-tests.xml
            ${{ runner.temp }}/windows-evidence/dependency-tests.txt
            ${{ runner.temp }}/windows-evidence/native-install-report.json
            ${{ runner.temp }}/windows-evidence/installed-dependencies.json
            ${{ runner.temp }}/windows-evidence/pytest.xml
            ${{ runner.temp }}/windows-evidence/pytest.txt
            ${{ runner.temp }}/windows-evidence/node-tests.txt
            ${{ runner.temp }}/windows-evidence/build.txt
            ${{ runner.temp }}/windows-evidence/build-evidence.json
            ${{ runner.temp }}/windows-evidence/native-smoke.json
            ${{ runner.temp }}/windows-evidence/browser.json
            ${{ runner.temp }}/windows-evidence/native-self-test-diagnostics.txt
            ${{ runner.temp }}/windows-evidence/native-browser-diagnostics.txt
            ${{ runner.temp }}/windows-evidence/native-math.png
            ${{ runner.temp }}/windows-evidence/native-text-chat.png
            ${{ runner.temp }}/windows-evidence/native-text-restored.png
          retention-days: 3
          if-no-files-found: error
  windows-required-gate:
    if: ${{ always() }}
    needs: [windows-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require native Windows job to execute successfully
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/assert_required_jobs.py windows-native
