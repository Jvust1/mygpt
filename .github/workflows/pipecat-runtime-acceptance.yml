name: Pipecat companion runtime acceptance

on:
  push:
    branches:
      - feat/pipecat-interruption-fusion-dot-20260930
      - feat/airi-chat-memory-brain-20260929
    paths:
      - 'brain/mygpt_brain/**'
      - 'brain/tests/**'
      - 'brain/realtime_tests/**'
      - 'brain/pyproject.toml'
      - '.github/workflows/pipecat-runtime-acceptance.yml'

permissions:
  contents: read

jobs:
  real-pipecat:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install exact Pipecat and repository test SDKs
        working-directory: brain
        run: python -m pip install '.[test,integrations,realtime]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Require full Brain suite with zero skips
        working-directory: brain
        env:
          OTEL_SDK_DISABLED: 'true'
        run: python scripts/verify_integrations.py --output "$RUNNER_TEMP/pipecat-brain-evidence"
      - name: Exercise real Pipecat queue and TTS aggregation offline
        working-directory: brain
        env:
          OTEL_SDK_DISABLED: 'true'
        run: python -m pytest -q realtime_tests --strict-markers
      - name: Compile runtime
        working-directory: brain
        run: python -m compileall -q mygpt_brain
