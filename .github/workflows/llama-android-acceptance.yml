name: Existing llama JNI build acceptance

# Only the aggregate workflow invokes this bounded build. Never re-enable the
# former push/full-Companion/binary-upload workflow by changing its old owner.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  llama-native-build:
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Require already installed licensed Android toolchain and JDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -n "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python scripts/verify_llama_toolchain.py preflight \
            --sdk "$ANDROID_HOME" --java "$JAVA_HOME_17_X64" \
            --cmake "$(command -v cmake)" --ninja "$(command -v ninja)" \
            --private-output "$RUNNER_TEMP/llama-private/toolchain.json"

      # The pinned action may query the runner's existing Gradle with -v. The
      # acquired project distribution is checked below before any project build.
      - name: Select the existing fixed official Gradle distribution
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
          add-job-summary: never
          dependency-graph: disabled
          build-scan-publish: false

      - name: Verify official Gradle archive and exact installed bytes before build
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/.gradle-actions/gradle-installations/downloads/gradle-8.14.3-bin.zip"
          # A cached/preinstalled copy does not bypass checksum verification.
          if [ ! -f "$ARCHIVE" ]; then
            mkdir -p "$(dirname "$ARCHIVE")"
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
              https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$ARCHIVE"
          fi
          python scripts/verify_llama_toolchain.py gradle \
            --archive "$ARCHIVE" --executable "$(command -v gradle)" \
            --project android_llm_spike \
            --private-output "$RUNNER_TEMP/llama-private/toolchain.json"

      - name: Fetch only the pinned llama submodule
        shell: bash
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules submodule.third_party/llama.cpp/upstream.url)" = \
            https://github.com/ggml-org/llama.cpp.git
          test "$(git ls-tree HEAD third_party/llama.cpp/upstream | awk '{print $3}')" = \
            ba0ba54d93b25faf1e149f4ccedd3e9d84798563
          git -c protocol.file.allow=never submodule update --init --depth 1 -- third_party/llama.cpp/upstream
          test "$(git -C third_party/llama.cpp/upstream rev-parse HEAD)" = \
            ba0ba54d93b25faf1e149f4ccedd3e9d84798563

      - name: Compile link and package the three existing local LLM targets
        shell: bash
        run: |
          set -euo pipefail
          # SDK/JDK installation is disabled; normal Maven and pinned upstream
          # KleidiAI source resolution remain available. No models are fetched.
          gradle -p android_llm_spike \
            -PmygptNativeCi=true -PmygptNativeNdk=29.0.14206865 \
            -Pandroid.builder.sdkDownload=false \
            -Porg.gradle.java.installations.auto-download=false \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.paths="$JAVA_HOME" \
            :llama-lib:assembleRelease :bridge:assembleRelease :app:assembleDebug \
            --no-daemon --no-build-cache --max-workers=2 \
            > "$RUNNER_TEMP/llama-private/build.log" 2>&1 || {
              python scripts/verify_llama_toolchain.py diagnose \
                --log "$RUNNER_TEMP/llama-private/build.log"
              exit 1;
            }

      - name: Verify finalized DSL actual native toolchain and ARM64 payload closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_llama_toolchain.py configured \
            --private-input "$RUNNER_TEMP/llama-private/toolchain.json" \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/llama-private/verified-toolchain.json"
          python scripts/verify_llama_payloads.py \
            --llama-aar third_party/llama.cpp/upstream/examples/llama.android/lib/build/outputs/aar/llama-lib-release.aar \
            --bridge-aar android_llm_spike/bridge/build/outputs/aar/bridge-release.aar \
            --apk android_llm_spike/app/build/outputs/apk/debug/app-debug.apk \
            --source-commit "$GITHUB_SHA" \
            --toolchain-json "$RUNNER_TEMP/llama-private/verified-toolchain.json" \
            --output "$RUNNER_TEMP/llama-public/native-build-summary.json"

      # Strictly one closed JSON artifact. No APK/AAR, source, model, cache,
      # absolute paths or raw logs are public artifacts, including on failure.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mygpt-llama-native-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llama-public/native-build-summary.json
          if-no-files-found: error
          retention-days: 3
