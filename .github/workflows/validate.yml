name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure baseline files exist
        shell: bash
        run: |
          test -s README.md
          test -f .gitignore
          test -f CONTRIBUTING.md
          test -f SECURITY.md

      - name: Check for accidentally committed secret files
        shell: bash
        run: |
          if find . -path './.git' -prune -o -type f \(
            -name '.env' -o \( -name '.env.*' ! -name '.env.example' \) -o
            -name '*.pem' -o -name '*.key'
          \) -print -quit | grep -q .; then
            echo "Secret-like files detected. Keep credentials out of the repository."
            exit 1
          fi
