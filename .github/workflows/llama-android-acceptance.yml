name: llama.cpp Android library acceptance

on:
  push:
    branches: [feat/airi-chat-memory-brain-20260929]
    paths:
      - '.gitmodules'
      - 'third_party/llama.cpp/**'
      - 'android_llm_spike/**'
      - '.github/workflows/llama-android-acceptance.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/llama.cpp/**'
      - 'android_llm_spike/**'
      - '.github/workflows/llama-android-acceptance.yml'

permissions:
  contents: read

jobs:
  llama-android-lib:
    if: github.repository == 'Jvust/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'

      - name: Verify pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/llama.cpp/upstream/LICENSE
          test -f third_party/llama.cpp/upstream/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          test -f third_party/llama.cpp/upstream/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          actual="$(git -C third_party/llama.cpp/upstream rev-parse HEAD)"
          test "$actual" = "ba0ba54d93b25faf1e149f4ccedd3e9d84798563"
          echo "llama.cpp pin PASS: $actual"

      - name: Install upstream Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build pinned llama.cpp JNI and MyGPT bridge
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          set -euo pipefail
          gradle -p android_llm_spike             :llama-lib:assembleRelease             :bridge:assembleRelease             :app:assembleDebug             --no-daemon --stacktrace

      - name: Verify upstream JNI and MyGPT bridge AARs
        shell: bash
        run: |
          set -euo pipefail
          llama_aar="third_party/llama.cpp/upstream/examples/llama.android/lib/build/outputs/aar/lib-release.aar"
          bridge_aar="android_llm_spike/bridge/build/outputs/aar/bridge-release.aar"
          apk="android_llm_spike/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$llama_aar"
          test -f "$bridge_aar"
          test -f "$apk"
          python - <<'PY'
          import zipfile
          llama = "third_party/llama.cpp/upstream/examples/llama.android/lib/build/outputs/aar/lib-release.aar"
          bridge = "android_llm_spike/bridge/build/outputs/aar/bridge-release.aar"
          with zipfile.ZipFile(llama) as z:
              names=set(z.namelist())
              native=[n for n in names if n.endswith("/libai-chat.so")]
              if "classes.jar" not in names or not native:
                  raise SystemExit("llama AAR missing classes.jar or libai-chat.so")
              print("llama AAR PASS:", native)
          with zipfile.ZipFile(bridge) as z:
              names=set(z.namelist())
              if "classes.jar" not in names:
                  raise SystemExit("bridge AAR missing classes.jar")
              print("MyGPT bridge AAR PASS")
          with zipfile.ZipFile("android_llm_spike/app/build/outputs/apk/debug/app-debug.apk") as z:
              names=set(z.namelist())
              native=[n for n in names if n.endswith("/libai-chat.so")]
              if "classes.dex" not in names or not native:
                  raise SystemExit("local LLM APK missing classes.dex or libai-chat.so")
              print("MyGPT local LLM APK PASS:", native)
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mygpt-llama-android-bridge
          path: |
            third_party/llama.cpp/upstream/examples/llama.android/lib/build/outputs/aar/lib-release.aar
            android_llm_spike/bridge/build/outputs/aar/bridge-release.aar
            android_llm_spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
