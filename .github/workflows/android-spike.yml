name: Android companion boundary spike
on:
  push:
    paths:
      - 'android_spike/**'
      - 'android_*/**/build.gradle.kts'
      - 'android_llm_spike/app/src/main/assets/**'
      - 'android_voice_spike/app/src/main/assets/**'
      - 'third_party/airi/LICENSE'
      - 'android_llm_spike/book-client-sdk/**'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/ModelFingerprintManifest.java'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/SherpaModelIdentity.java'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/AudioFloatResampler.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/AudioFloatResamplerSmoke.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/ModelFingerprintManifestSmoke.java'
      - 'third_party/gson/**'
      - '.github/workflows/android-spike.yml'
  pull_request:
    paths:
      - 'android_spike/**'
      - 'android_*/**/build.gradle.kts'
      - 'android_llm_spike/app/src/main/assets/**'
      - 'android_voice_spike/app/src/main/assets/**'
      - 'third_party/airi/LICENSE'
      - 'android_llm_spike/book-client-sdk/**'
      - 'android_voice_spike/app/src/main/java/dev/mygpt/voicespike/AudioFloatResampler.java'
      - 'android_voice_spike/app/src/test/java/dev/mygpt/voicespike/AudioFloatResamplerSmoke.java'
      - 'third_party/gson/**'
      - '.github/workflows/android-spike.yml'

permissions:
  contents: read

concurrency:
  group: mygpt-android-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java8-boundary:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    if: github.repository == 'Jvust1/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Fetch and verify pinned Gson streaming reader
        shell: bash
        run: |
          set -euo pipefail
          GSON_JAR="$RUNNER_TEMP/gson-2.14.0.jar"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar \
            -o "$GSON_JAR"
          python android_spike/tools/verify_gson_artifact.py "$GSON_JAR"
          echo "GSON_JAR=$GSON_JAR" >> "$GITHUB_ENV"
      - name: Compile for Java 8 and run boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android_spike/build/classes
          if test "${{ matrix.java }}" = 8; then
            JAVAC_COMPAT=(-source 8 -target 8)
          else
            JAVAC_COMPAT=(--release 8)
          fi
          javac "${JAVAC_COMPAT[@]}" -cp "$GSON_JAR" -d android_spike/build/classes \
            android_spike/src/main/java/dev/mygpt/spike/CompanionCoordinator.java \
            android_spike/src/main/java/dev/mygpt/spike/SkinCapabilityCatalog.java \
            android_spike/src/main/java/dev/mygpt/spike/PresentationEmotion.java \
            android_spike/src/main/java/dev/mygpt/spike/SpinePackageLayout.java \
            android_spike/src/main/java/dev/mygpt/spike/VoicePcm.java \
            android_spike/src/main/java/dev/mygpt/spike/LocalLlmEngine.java \
            android_spike/src/main/java/dev/mygpt/spike/SerializedLocalLlmEngine.java \
            android_spike/src/main/java/dev/mygpt/spike/FloatDragPolicy.java \
            android_spike/src/main/java/dev/mygpt/spike/AiriActEmotionParser.java \
            android_spike/src/main/java/dev/mygpt/spike/OnDeviceCompanionBrain.java \
            android_spike/src/main/java/dev/mygpt/spike/GgufModelProbe.java \
            android_spike/src/main/java/dev/mygpt/spike/GgufModelInstaller.java \
            android_spike/src/main/java/dev/mygpt/spike/BookContextSnapshot.java \
            android_spike/src/main/java/dev/mygpt/spike/BookContextMailbox.java \
            android_spike/src/main/java/dev/mygpt/spike/StudySupervisorRuntime.java \
            android_spike/src/main/java/dev/mygpt/spike/CompanionPromptBudget.java \
            android_spike/src/main/java/dev/mygpt/spike/LlmBenchmarkCandidateCatalog.java \
            android_llm_spike/book-client-sdk/src/main/java/dev/mygpt/bookbridge/BookCompanionContract.java \
            android_llm_spike/book-client-sdk/src/main/java/dev/mygpt/bookbridge/BookContextPayload.java \
            android_llm_spike/book-client-sdk/src/main/java/dev/mygpt/bookbridge/BookCompanionSession.java \
            android_voice_spike/app/src/main/java/dev/mygpt/voicespike/ModelFingerprintManifest.java \
            android_voice_spike/app/src/main/java/dev/mygpt/voicespike/SherpaModelIdentity.java \
            android_voice_spike/app/src/main/java/dev/mygpt/voicespike/AudioFloatResampler.java \
            android_spike/src/test/java/dev/mygpt/spike/CompanionCoordinatorSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/SpinePackageLayoutSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/SkinCapabilityCatalogSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/VoicePcmSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/LocalLlmEngineSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/FloatDragPolicySmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/OnDeviceCompanionBrainSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/AiriActGoldenSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/GgufModelProbeSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/GgufModelInstallerSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/BookContextMailboxSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/StudySupervisorRuntimeSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/CompanionPromptBudgetSmoke.java \
            android_spike/src/test/java/dev/mygpt/spike/LlmBenchmarkCandidateCatalogSmoke.java \
            android_llm_spike/book-client-sdk/src/test/java/dev/mygpt/bookbridge/BookClientSdkSmoke.java \
            android_voice_spike/app/src/test/java/dev/mygpt/voicespike/ModelFingerprintManifestSmoke.java \
            android_voice_spike/app/src/test/java/dev/mygpt/voicespike/SherpaModelIdentitySmoke.java \
            android_voice_spike/app/src/test/java/dev/mygpt/voicespike/AudioFloatResamplerSmoke.java
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.CompanionCoordinatorSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.SpinePackageLayoutSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.SkinCapabilityCatalogSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.VoicePcmSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.LocalLlmEngineSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.FloatDragPolicySmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.OnDeviceCompanionBrainSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.AiriActGoldenSmoke android_spike/src/test/resources/airi-act-golden.json
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.GgufModelProbeSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.GgufModelInstallerSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.BookContextMailboxSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.StudySupervisorRuntimeSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.CompanionPromptBudgetSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.spike.LlmBenchmarkCandidateCatalogSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.bookbridge.BookClientSdkSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.voicespike.ModelFingerprintManifestSmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.voicespike.SherpaModelIdentitySmoke
          java -cp "android_spike/build/classes:$GSON_JAR" dev.mygpt.voicespike.AudioFloatResamplerSmoke

  android-debug-host:
    if: github.repository == 'Jvust/mygpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Check hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Build isolated synthetic Android test host
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_spike :app:assembleDebug --no-daemon
      - name: Verify Spine host APK native payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          apk = "android_spike/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = "lib/arm64-v8a/libgdx.so"
              if required not in names:
                  raise SystemExit(f"missing {required}")
              if "classes.dex" not in names:
                  raise SystemExit("missing classes.dex")
              if "assets/SPINE_RUNTIME_LICENSE.txt" not in names:
                  raise SystemExit("missing Spine runtime license notice")
              print("APK native payload PASS:", required)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mygpt-spine-3714430278-android-spike
          path: android_spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
